version: '3.9'

services:
  mongo:
    image: mongo:7.0
    container_name: chatflow_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chatflow

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chatflow_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/chatflow
      - FLASK_ENV=production
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: chatflow_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
